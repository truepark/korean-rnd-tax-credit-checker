name: RND regression
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q remote_mcp_server.py rnd_tax_checker
      - run: |
          python - <<'PY'
          import asyncio
          import json
          from unittest.mock import patch
          from starlette.requests import Request
          from rnd_tax_checker.rnd_or_kr import _parse_html_records, normalize_business_number
          import remote_mcp_server as server
          assert normalize_business_number("135-81-98342") == "1358198342"
          count, records = _parse_html_records("<p>총 1건</p><table><tr><th>기업명</th><th>연구소명</th><th>구분</th></tr><tr><td>테스트</td><td>연구소</td><td>기업부설</td></tr></table>")
          assert count == 1 and len(records) == 1
          count, records = _parse_html_records("<p>총 1건</p><table><tr><td colspan='3'>검색결과</td></tr><tr><th>회 사 명</th><th>연구소 명</th><th>유형</th></tr><tr><td>테스트</td><td>연구소</td><td>기업부설</td></tr></table>")
          assert count == 1 and len(records) == 1
          base = '<div class="search-table-section"><div class="table-total">총 <span class="total-number">{}</span>개</div><div class="c__table"><div class="tbody">{}</div></div></div>'
          assert _parse_html_records(base.format(0, '<div class="tr">등록된 게시글이 없습니다.</div>')) == (0, [])
          row = '<div class="tr"><div class="num">1</div><div class="company">테스트기업</div><div class="department">테스트연구소</div><div class="scale">중소기업</div><div class="field">기계</div><div class="sort">기업부설연구소</div><div class="product"></div></div>'
          count, records = _parse_html_records(base.format(1, row))
          assert count == 1 and len(records) == 1 and records[0].company_name == "테스트기업" and records[0].lab_name == "테스트연구소"
          assert _parse_html_records(base.format(1, "")) == (1, [])
          actual = '<div class="tr"><div class="td num">1</div><div class="td company"><span class="detail-link" data-code="3419101">비티에스테크놀로지스(주)</span></div><div class="td department"><span class="detail-link" data-code="3419101">비티에스테크놀로지스(주)기술연구소</span></div><div class="td scale">벤처기업</div><div class="td field">출판, 영상, 방송통신 및 정보서비스</div><div class="td sort">연구소</div><div class="td product"></div></div>'
          count, records = _parse_html_records(base.format(1, actual).replace('</div></div></div>', '</div></div><div class="mobile-search-list"><div class="mobile-search-item">비티에스테크놀로지스(주)</div></div></div>', 1))
          assert count == 1 and len(records) == 1
          assert records[0].to_dict() == {"company_name":"비티에스테크놀로지스(주)","lab_name":"비티에스테크놀로지스(주)기술연구소","scale":"벤처기업","research_field":"출판, 영상, 방송통신 및 정보서비스","lab_type":"연구소"}
          from rnd_tax_checker import rnd_or_kr as rnd
          with patch.object(rnd, "_lookup_via_post", return_value=rnd.RndLabLookupResult("response_parse_error", "1358198342", total_count=1)), patch.object(rnd, "_lookup_via_playwright", return_value=rnd.RndLabLookupResult("response_parse_error", "1358198342")):
              result = rnd.lookup_rnd_lab("1358198342").to_dict()
              assert result["status"] == "response_parse_error" and result["total_count"] == 1 and result["records"] == []
          async def check():
              def sync_lookup(*args, **kwargs):
                  try:
                      asyncio.get_running_loop()
                  except RuntimeError:
                      return {"status": "confirmed"}
                  raise AssertionError("sync lookup on event loop")
              req = Request({"type":"http","path_params":{"business_number":"1358198342"}})
              with patch.object(server, "_search_rnd_lab_sync", sync_lookup):
                  assert await server.search_rnd_lab("1358198342") == {"status": "confirmed"}
                  response = await server.search_rnd_lab_http(req)
                  assert response.status_code == 200
                  assert json.loads(response.body) == {"status": "confirmed"}
              invalid = await server.search_rnd_lab("12345")
              assert invalid["status"] == "invalid_input"
          asyncio.run(check())
          PY
